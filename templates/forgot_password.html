{% extends 'base.html' %}
{% block title %}Forgot Password - Hospital Queue System{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h2 class="mb-4">Forgot Password</h2>
                <p class="text-muted mb-4">Enter your email address and we'll help you reset your password.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Reset Instructions</button>
                </form>
                <p class="mt-3 mb-0"><a href="{{ url_for('login') }}">Back to Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Reset Password - Hospital Queue System{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h2 class="mb-4">{{ _('Reset Password') }}</h2>
                <p class="text-muted mb-4">{{ _('Enter your new password below.') }}</p>
                <form method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ _('New Password') }}</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">{{ _('Confirm New Password') }}</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Reset Password</button>
                </form>
                <p class="mt-3 mb-0"><a href="{{ url_for('login') }}">Back to Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

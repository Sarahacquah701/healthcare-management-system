{% extends 'base.html' %}
{% block title %}{{ _('Login') }} - Hospital Queue System{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h2 class="mb-4" data-i18n="login.title">{{ _('Login') }}</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label" data-i18n="login.username_label">{{ _('Username') }}</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="{{ _('Enter your username') }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label" data-i18n="login.password_label">{{ _('Password') }}</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="{{ _('Enter your password') }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary" data-i18n="login.submit">{{ _('Login') }}</button>
                </form>
                <p class="mt-3 mb-0"><span data-i18n="login.no_account">{{ _('Don\'t have an account?') }}</span> <a href="{{ url_for('register') }}" data-i18n="login.register_link">{{ _('Register here') }}</a>.</p>
                <p class="mt-2 mb-0"><a href="{{ url_for('forgot_password') }}" data-i18n="login.forgot_password">{{ _('Forgot your password?') }}</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
